apiVersion: aws.hypersurgery/v1alpha1
kind: SheetExport
metadata:
  name: organization
spec:
  scopeRef: organization
  # docs.google.com/spreadsheets/d/<spreadsheetID>/edit
  spreadsheetID: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789
  sheetName: Subnets
  credentialsSecretRef:
    name: google-sheets
    namespace: aws-subnet-operator-system
    key: credentials.json
  # One extra column per AWS tag key.
  extraTagColumns: [cost-center]
  refreshInterval: 5m
