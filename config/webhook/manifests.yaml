---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-network-hypersurgery-dev-v1-networkscope
  failurePolicy: Ignore
  name: mnetworkscope-v1.kb.io
  rules:
  - apiGroups:
    - network.hypersurgery.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - networkscopes
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-network-hypersurgery-dev-v1-resourceimport
  failurePolicy: Ignore
  name: mresourceimport-v1.kb.io
  rules:
  - apiGroups:
    - network.hypersurgery.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - resourceimports
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-network-hypersurgery-dev-v1-subnetclaim
  failurePolicy: Ignore
  name: msubnetclaim-v1.kb.io
  rules:
  - apiGroups:
    - network.hypersurgery.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - subnetclaims
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-network-hypersurgery-dev-v1-networkscope
  failurePolicy: Fail
  name: vnetworkscope-v1.kb.io
  rules:
  - apiGroups:
    - network.hypersurgery.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - networkscopes
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-network-hypersurgery-dev-v1-resourceimport
  failurePolicy: Fail
  name: vresourceimport-v1.kb.io
  rules:
  - apiGroups:
    - network.hypersurgery.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - resourceimports
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-network-hypersurgery-dev-v1-subnetclaim
  failurePolicy: Fail
  name: vsubnetclaim-v1.kb.io
  rules:
  - apiGroups:
    - network.hypersurgery.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - subnetclaims
  sideEffects: None
