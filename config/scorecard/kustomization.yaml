# The scorecard configuration that `make bundle` places in bundle/tests/scorecard, where
# `operator-sdk scorecard` reads it. The test image is pinned by digest and moves with
# OPERATOR_SDK_VERSION in the Makefile.
resources:
- bases/config.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
- path: patches/basic.config.yaml
  target:
    group: scorecard.operatorframework.io
    kind: Configuration
    name: config
    version: v1alpha3
- path: patches/olm.config.yaml
  target:
    group: scorecard.operatorframework.io
    kind: Configuration
    name: config
    version: v1alpha3
