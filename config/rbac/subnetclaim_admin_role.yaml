# This rule is not used by the project subnet-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over network.hypersurgery.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: subnet-operator
    app.kubernetes.io/managed-by: kustomize
  name: subnetclaim-admin-role
rules:
- apiGroups:
  - network.hypersurgery.dev
  resources:
  - subnetclaims
  verbs:
  - '*'
- apiGroups:
  - network.hypersurgery.dev
  resources:
  - subnetclaims/status
  verbs:
  - get
