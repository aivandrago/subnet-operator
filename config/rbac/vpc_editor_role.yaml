# This rule is not used by the project aws-subnet-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the aws.hypersurgery.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aws-subnet-operator
    app.kubernetes.io/managed-by: kustomize
  name: vpc-editor-role
rules:
- apiGroups:
  - aws.hypersurgery
  resources:
  - vpcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aws.hypersurgery
  resources:
  - vpcs/status
  verbs:
  - get
