---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: subnets.aws.hypersurgery
spec:
  group: aws.hypersurgery
  names:
    kind: Subnet
    listKind: SubnetList
    plural: subnets
    singular: subnet
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcID
      name: VPC
      type: string
    - jsonPath: .status.cidrBlock
      name: CIDR
      type: string
    - jsonPath: .status.availabilityZone
      name: AZ
      type: string
    - jsonPath: .status.public
      name: Public
      type: boolean
    - jsonPath: .status.availableIPs
      name: Free IPs
      type: integer
    - jsonPath: .status.utilizationPercent
      name: Used %
      type: integer
    - jsonPath: .status.owner
      name: Owner
      type: string
    - jsonPath: .spec.account
      name: Account
      priority: 1
      type: string
    - jsonPath: .spec.region
      name: Region
      priority: 1
      type: string
    - jsonPath: .status.name
      name: Name
      priority: 1
      type: string
    - jsonPath: .status.env
      name: Env
      priority: 1
      type: string
    - jsonPath: .status.tier
      name: Tier
      priority: 1
      type: string
    - jsonPath: .status.missingTags
      name: Missing tags
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Subnet is an AWS subnet discovered by a NetworkScope. It is read-only
          for users.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec identifies the subnet
            properties:
              account:
                description: account is the AWS account ID that owns the subnet.
                type: string
              region:
                description: region is the AWS region of the subnet.
                type: string
              subnetID:
                description: subnetID is the AWS subnet ID.
                type: string
              vpcID:
                description: vpcID is the AWS VPC ID the subnet belongs to.
                type: string
            required:
            - account
            - region
            - subnetID
            - vpcID
            type: object
          status:
            description: status is the observed state of the subnet
            properties:
              availabilityZone:
                description: availabilityZone is the AZ name, e.g. eu-central-1a.
                type: string
              availabilityZoneID:
                description: availabilityZoneID is the account-independent AZ ID,
                  e.g. euc1-az2.
                type: string
              availableIPs:
                description: availableIPs is the number of free IPv4 addresses.
                format: int64
                type: integer
              cidrBlock:
                description: cidrBlock is the IPv4 CIDR block.
                type: string
              env:
                description: env is read from the env tag configured in the NetworkScope.
                type: string
              ipv6CIDRBlocks:
                description: ipv6CIDRBlocks are the associated IPv6 CIDR blocks.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              missingTags:
                description: missingTags lists required tag keys that are absent or
                  empty.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              name:
                description: name is the value of the Name tag.
                type: string
              owner:
                description: owner is read from the owner tag configured in the NetworkScope.
                type: string
              public:
                description: public is true when the subnet's route table has a default
                  route to an internet gateway.
                type: boolean
              routeTableID:
                description: routeTableID is the explicitly associated route table,
                  or the VPC main route table.
                type: string
              state:
                description: state is the AWS subnet state.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: tags are the AWS tags of the subnet.
                type: object
              tier:
                description: tier is read from the tier tag configured in the NetworkScope.
                type: string
              totalIPs:
                description: totalIPs is the number of usable IPv4 addresses (AWS
                  reserves 5 per subnet).
                format: int64
                type: integer
              utilizationPercent:
                description: utilizationPercent is the share of used IPv4 addresses,
                  0-100.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
