---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: subnets.network.hypersurgery.dev
spec:
  group: network.hypersurgery.dev
  names:
    categories:
    - hypersurgery
    kind: Subnet
    listKind: SubnetList
    plural: subnets
    shortNames:
    - hssubnet
    singular: subnet
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.networkID
      name: Network
      type: string
    - jsonPath: .status.cidrBlock
      name: CIDR
      type: string
    - jsonPath: .status.zone
      name: Zone
      type: string
    - jsonPath: .status.availableIPs
      name: Free IPs
      type: integer
    - jsonPath: .status.utilizationPercent
      name: Used %
      type: integer
    - jsonPath: .status.owner
      name: Owner
      type: string
    - jsonPath: .spec.provider
      name: Provider
      priority: 1
      type: string
    - jsonPath: .status.aws.public
      name: Public
      priority: 1
