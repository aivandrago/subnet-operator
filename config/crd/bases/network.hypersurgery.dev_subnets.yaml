    - jsonPath: .spec.account
      name: Account
      priority: 1
      type: string
    - jsonPath: .spec.region
      name: Region
      priority: 1
      type: string
    - jsonPath: .status.name
      name: Name
      priority: 1
      type: string
    - jsonPath: .status.env
      name: Env
      priority: 1
      type: string
