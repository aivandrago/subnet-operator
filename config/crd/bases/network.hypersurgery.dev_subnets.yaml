    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Subnet is a subnet discovered by a NetworkScope. It is read-only for users. On AWS the
          object is named after the subnet ID; on GCP and Azure, whose subnet names repeat across
          networks, after the subnet's name and a hash of its resource name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec identifies the subnet
            properties:
              account:
                description: account is the account that owns the subnet.
                type: string
              id:
                description: |-
                  id is the provider's ID of the subnet: the subnet ID on AWS, the subnetwork's resource
                  name (projects/<project>/regions/<region>/subnetworks/<name>) on GCP, the subnet's
                  resource ID (<virtual network ID>/subnets/<name>) in lowercase on Azure.
                type: string
              networkID:
                description: networkID is the ID of the network the subnet belongs
                  to, as the network's spec.id.
                type: string
              provider:
                description: provider is the provider of the scope that discovered
                  the subnet.
                enum:
                - AWS
                - GCP
                - Azure
                type: string
              region:
                description: region of the subnet.
                type: string
            required:
            - account
            - id
            - networkID
            - provider
            - region
            type: object
          status:
            description: status is the observed state of the subnet
            properties:
              availableIPs:
                description: |-
                  availableIPs is the number of free IPv4 addresses. Unset when the provider could not
                  report it, which is not the same as zero.
                format: int64
                type: integer
              aws:
                description: aws holds what only an AWS subnet has.
                properties:
                  availabilityZoneID:
                    description: availabilityZoneID is the account-independent AZ
                      ID, e.g. euc1-az2.
                    type: string
                  public:
                    description: public is true when the subnet's route table has
                      a default route to an internet gateway.
                    type: boolean
                  routeTableID:
                    description: routeTableID is the explicitly associated route table,
                      or the VPC main route table.
                    type: string
                type: object
              azure:
                description: azure holds what only an Azure subnet has.
                properties:
                  delegations:
                    description: |-
                      delegations are the services the subnet is delegated to, such as
                      Microsoft.Web/serverFarms.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  ipConfigurations:
                    description: |-
                      ipConfigurations is the number of IP configurations in the subnet: network interfaces,
                      private endpoints, internal load balancer frontends.
                    format: int32
                    type: integer
                  ipUsageSource:
                    description: |-
                      ipUsageSource says where availableIPs came from: VirtualNetworkUsage (Azure's usage of the
                      virtual network, per subnet) or IPConfigurations (the subnet's usable addresses less its IP
                      configurations, when that usage did not cover the subnet). Empty while availableIPs is
                      unknown.
                    type: string
                  natGatewayID:
                    description: natGatewayID is the resource ID of the NAT gateway
                      associated with the subnet.
                    type: string
                  networkSecurityGroupID:
                    description: |-
                      networkSecurityGroupID is the resource ID of the network security group associated with
                      the subnet.
                    type: string
                  resourceGroup:
                    description: |-
                      resourceGroup is the resource group of the subnet's virtual network, spelt as Azure
                      returned it.
                    type: string
                  routeTableID:
                    description: routeTableID is the resource ID of the route table
                      associated with the subnet.
                    type: string
                  serviceEndpoints:
                    description: |-
                      serviceEndpoints are the services the subnet has service endpoints for, such as
                      Microsoft.Storage.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  serviceManaged:
                    description: |-
                      serviceManaged is true when a service manages addresses in the subnet: it is delegated,
                      or has service association or resource navigation links (App Service, SQL Managed
                      Instance and the like). Such services may use addresses that are not IP configurations,
                      so availableIPs is less certain.
                    type: boolean
                type: object
              cidrBlock:
                description: cidrBlock is the IPv4 CIDR block (on GCP the primary
                  range).
                type: string
              env:
                description: env is read from the env tag configured in the NetworkScope.
                type: string
              gcp:
                description: gcp holds what only a GCP subnetwork has.
                properties:
                  ipv6AccessType:
                    description: ipv6AccessType is INTERNAL or EXTERNAL for a subnetwork
                      with IPv6.
                    type: string
                  privateIPGoogleAccess:
                    description: privateIPGoogleAccess is true when VMs without external
                      addresses can reach Google APIs.
                    type: boolean
                  purpose:
                    description: |-
                      purpose is what the subnetwork is for: PRIVATE for ordinary subnets, or a special
                      purpose such as REGIONAL_MANAGED_PROXY or PRIVATE_SERVICE_CONNECT, whose addresses are
                      not for VMs.
                    type: string
                  role:
                    description: role is ACTIVE or BACKUP for a proxy-only subnetwork,
                      empty otherwise.
                    type: string
                  secondaryRanges:
                    description: |-
                      secondaryRanges are the subnetwork's secondary IPv4 ranges with their usage. Their
                      addresses are not counted in the subnet's totalIPs and availableIPs.
                    items:
                      description: |-
                        GCPSecondaryRange is a secondary IPv4 range of a GCP subnetwork, such as the Pod and
                        Service ranges of a GKE cluster.
                      properties:
                        availableIPs:
                          description: availableIPs is the number of free addresses
                            in the range. Unset when unknown.
                          format: int64
                          type: integer
                        cidrBlock:
                          description: cidrBlock is the range.
                          type: string
                        name:
                          description: name is the range's name within the subnetwork.
                          type: string
                        totalIPs:
                          description: totalIPs is the number of addresses in the
                            range (a secondary range reserves none).
                          format: int64
                          type: integer
                      required:
                      - cidrBlock
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  stackType:
                    description: stackType is IPV4_ONLY, IPV4_IPV6 or IPV6_ONLY.
                    type: string
                type: object
              ipv6CIDRBlocks:
                description: ipv6CIDRBlocks are the associated IPv6 CIDR blocks.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              missingTags:
                description: missingTags lists required tag keys that are absent or
                  empty.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              name:
                description: |-
                  name is the subnet's name: the value of the Name tag on AWS, the resource's name on GCP
                  and Azure.
                type: string
              owner:
                description: owner is read from the owner tag configured in the NetworkScope.
                type: string
              ownershipSource:
                description: |-
                  ownershipSource says where owner, env and tier were read from: Subnet (the subnet's own
                  metadata) or Network (inherited from its network, on providers whose subnets cannot
                  carry metadata of their own).
                type: string
              secondaryCIDRBlocks:
                description: |-
                  secondaryCIDRBlocks are further IPv4 ranges of the subnet that are not its primary
                  block, such as the secondary ranges of a GCP subnetwork. They take addresses of the
                  network like cidrBlock does, but are not counted in totalIPs and availableIPs. On Azure
                  they are the subnet's further IPv4 address prefixes, which are: Azure places addresses in
                  any prefix of a subnet and reports one usage for all of them.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              state:
                description: state is the provider's state of the subnet.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: |-
                  tags are the subnet's tags at the provider. Azure subnets cannot carry tags: there they
                  are the tags of the subnet's virtual network, with the subnet's own entry on it
                  (hs-subnet-<subnet name>) laid over them key by key.
                type: object
              tier:
                description: tier is read from the tier tag configured in the NetworkScope.
                type: string
              totalIPs:
                description: |-
                  totalIPs is the number of usable IPv4 addresses, as the provider counts them (AWS
                  reserves 5 per subnet, GCP 4 in the primary range, Azure 5 in each address prefix). Unset
                  when unknown.
                format: int64
                type: integer
              utilizationPercent:
                description: utilizationPercent is the share of used IPv4 addresses,
                  0-100. Unset when unknown.
                format: int32
                type: integer
              zone:
                description: |-
                  zone is the zone of a zonal subnet, e.g. the AWS availability zone eu-central-1a. Empty
                  for providers whose subnets are regional.
                type: string
            type: object
        required:
        - spec
        type: object
