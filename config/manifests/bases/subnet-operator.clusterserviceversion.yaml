apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Networking, Cloud Provider
    description: Discovers AWS VPCs and subnets across accounts and regions from their
      tags, keeps them as a live inventory in the cluster, and allocates CIDRs on
      request.
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    operatorframework.io/suggested-namespace: subnet-operator-system
    operators.operatorframework.io/internal-objects: '["networks.network.hypersurgery.dev","subnets.network.hypersurgery.dev"]'
    repository: https://github.com/aivandrago/subnet-operator
    support: https://github.com/aivandrago/subnet-operator/issues
  name: subnet-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: |-
        Network is a network discovered by a NetworkScope: an AWS VPC. It is read-only for users.
        On AWS the object is named after the VPC ID.
      displayName: Network
      kind: Network
      name: networks.network.hypersurgery.dev
      specDescriptors:
      - description: account is the account that owns the network.
        displayName: Account
        path: account
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: id is the provider's ID of the network; for AWS the VPC ID.
        displayName: ID
        path: id
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: provider is the provider of the scope that discovered the network.
        displayName: Provider
        path: provider
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: region of the network. Empty for providers whose networks are
          global.
        displayName: Region
        path: region
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      statusDescriptors:
      - description: |-
          availableIPs is the sum of free IPv4 addresses in all subnets. Unset when the free
          addresses of any subnet are unknown.
        displayName: Free IPs
        path: availableIPs
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: cidrBlocks are the associated IPv4 CIDR blocks, primary first.
        displayName: CIDR Blocks
        path: cidrBlocks
      - description: name is the value of the Name tag.
        displayName: Name
        path: name
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          overlapsWith lists networks in the same NetworkScope whose CIDRs overlap this one, as
          "<account>/<region>/<id>". Overlaps break peering and transit routing.
        displayName: Overlaps With
        path: overlapsWith
      - description: owner is read from the owner tag configured in the NetworkScope.
        displayName: Owner
        path: owner
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: state is the provider's state of the network.
        displayName: State
        path: state
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: subnets is the number of discovered subnets.
        displayName: Subnets
        path: subnets
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      version: v1
    - description: |-
        Network is a network discovered by a NetworkScope: an AWS VPC. It is read-only for users.
        On AWS the object is named after the VPC ID.
      displayName: Network
      kind: Network
      name: networks.network.hypersurgery.dev
      specDescriptors:
      - description: account is the account that owns the network.
        displayName: Account
        path: account
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: id is the provider's ID of the network; for AWS the VPC ID.
        displayName: ID
        path: id
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: provider is the provider of the scope that discovered the network.
        displayName: Provider
        path: provider
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: region of the network. Empty for providers whose networks are
          global.
        displayName: Region
        path: region
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      statusDescriptors:
      - description: |-
          availableIPs is the sum of free IPv4 addresses in all subnets. Unset when the free
          addresses of any subnet are unknown.
        displayName: Free IPs
        path: availableIPs
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: cidrBlocks are the associated IPv4 CIDR blocks, primary first.
        displayName: CIDR Blocks
        path: cidrBlocks
      - description: name is the value of the Name tag.
        displayName: Name
        path: name
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          overlapsWith lists networks in the same NetworkScope whose CIDRs overlap this one, as
          "<account>/<region>/<id>". Overlaps break peering and transit routing.
        displayName: Overlaps With
        path: overlapsWith
      - description: owner is read from the owner tag configured in the NetworkScope.
        displayName: Owner
        path: owner
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: state is the provider's state of the network.
        displayName: State
        path: state
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: subnets is the number of discovered subnets.
        displayName: Subnets
        path: subnets
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      version: v1beta1
    - description: |-
        NetworkScope selects the accounts and regions of one provider whose networks and subnets
        are discovered.
      displayName: Network Scope
      kind: NetworkScope
      name: networkscopes.network.hypersurgery.dev
      resources:
      - kind: Event
        name: ""
        version: v1
      - kind: Network
        name: ""
        version: v1
      - kind: ResourceImport
        name: ""
        version: v1
      - kind: Subnet
        name: ""
        version: v1
      specDescriptors:
      - description: accounts to discover.
        displayName: Accounts
        path: accounts
      - description: |-
          autoImport tags unmanaged resources on its own, deriving the tags from who created the
          resource, from its network, or from the account. Off unless configured.
        displayName: Auto Import
        path: autoImport
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: |-
          discoverUnmanaged also lists the networks the selector does not match, and their
          subnets, so resources nobody has claimed are counted and can be imported instead of
          staying invisible. They are reported and alerted on, never mirrored as objects.
        displayName: Discover Unmanaged
        path: discoverUnmanaged
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: |-
          namespaceSelector selects the namespaces whose SubnetClaims and ResourceImports may refer
          to this scope. Referring to a scope is what makes the operator use its identities,
          including the write identities, on the object's behalf, so this is what keeps one team's
          namespace from creating subnets in, or tagging, another team's accounts.

          Select namespaces by name with the kubernetes.io/metadata.name label, which the API
          server sets on every namespace and nobody can change, or by a label only cluster
          administrators can set. An empty selector ({}) allows every namespace on purpose.

          When unset, no namespace may use the scope. (In aws.hypersurgery/v1alpha1 unset allowed
          every namespace; migrated scopes get an explicit {} instead.)
        displayName: Namespace Selector
        path: namespaceSelector
      - description: |-
          networkSelector limits discovery to the networks (AWS VPCs) it selects. When unset or
          empty, every network is discovered.
        displayName: Network Selector
        path: networkSelector
      - description: |-
          provider is the cloud the scope discovers. It cannot change: a scope does not move
          clouds, a new scope does. More values are added by the releases that implement them.
        displayName: Provider
        path: provider
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:select:AWS
      - description: |-
          regions to discover in every account (unless the account overrides them): AWS regions
          such as eu-central-1. Each region is listed once.
        displayName: Regions
        path: regions
      - description: |-
          requiredSubnetTags are tag keys every subnet must have. Missing keys are reported in the
          Subnet status and as metrics.
        displayName: Required Subnet Tags
        path: requiredSubnetTags
      - description: resyncInterval is how often the full inventory is refreshed.
        displayName: Resync Interval
        path: resyncInterval
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
        - urn:alm:descriptor:com.tectonic.ui:advanced
      statusDescriptors:
      - description: 'conditions: Ready is True when every target synced successfully.'
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - description: lastSyncTime is when the last full sync finished.
        displayName: Last Sync
        path: lastSyncTime
        x-descriptors:
        - urn:alm:descriptor:timestamp
      - description: networks is the number of networks discovered across all targets.
        displayName: Networks
        path: networks
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: subnets is the number of subnets discovered across all targets.
        displayName: Subnets
        path: subnets
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: targets reports each account/region pair.
        displayName: Targets
        path: targets
      - description: |-
          unmanaged is the number of discovered resources without the managed tag, across all
          targets. Anything above zero is something nobody has taken responsibility for.
        displayName: Unmanaged
        path: unmanaged
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      version: v1
    - description: |-
        NetworkScope selects the accounts and regions of one provider whose networks and subnets
        are discovered.
      displayName: Network Scope
      kind: NetworkScope
      name: networkscopes.network.hypersurgery.dev
      resources:
      - kind: Event
        name: ""
