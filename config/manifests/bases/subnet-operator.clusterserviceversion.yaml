    - description: |-
        SheetExport mirrors the subnets of a NetworkScope into a Google Sheet, for people who
        still want to look at a table. The sheet is written by the operator and never read back.
      displayName: Sheet Export
      kind: SheetExport
      name: sheetexports.network.hypersurgery.dev
      resources:
      - kind: Secret
        name: ""
        version: v1
      specDescriptors:
      - description: credentialsSecretRef holds the Google service account JSON.
        displayName: Credentials Secret
        path: credentialsSecretRef
      - description: extraTagColumns adds one column per tag key, after the standard
          columns.
        displayName: Extra Tag Columns
        path: extraTagColumns
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: refreshInterval is how often the sheet is rewritten.
        displayName: Refresh Interval
        path: refreshInterval
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: scopeRef is the NetworkScope whose subnets are exported.
        displayName: NetworkScope
        path: scopeRef
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          sheetName is the tab that holds the inventory. It is created if missing and fully
          rewritten on every export, so people should not keep their own data in it.
        displayName: Sheet Name
        path: sheetName
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          spreadsheetID is the ID from the spreadsheet URL
          (docs.google.com/spreadsheets/d/<spreadsheetID>/edit). The spreadsheet must be shared
          with the service account as an editor.
        displayName: Spreadsheet ID
        path: spreadsheetID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      statusDescriptors:
      - description: 'conditions: Ready is True when the last export succeeded.'
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - description: lastExportTime is when the sheet was last written.
        displayName: Last Export
        path: lastExportTime
        x-descriptors:
        - urn:alm:descriptor:timestamp
      - description: rows is the number of subnets in the sheet, excluding the header.
        displayName: Rows
        path: rows
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: url links to the exported sheet.
        displayName: Sheet URL
        path: url
        x-descriptors:
        - urn:alm:descriptor:org.w3:link
      version: v1
