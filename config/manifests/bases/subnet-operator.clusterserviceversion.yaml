  description: |
    subnet-operator replaces the hand-maintained VPC and subnet inventory (the usual shared
    spreadsheet) with one that is discovered and kept current. AWS today; GCP and Azure follow
    behind the same provider-neutral API.

    ## What it does

    * **Discovery.** A `NetworkScope` names accounts, regions and a tag selector. The operator
      finds the matching VPCs and subnets, calling only EC2 `Describe*` APIs, and mirrors them
      as cluster-scoped `Network` and `Subnet` objects with CIDRs, free addresses, utilization,
      owner/env/tier tags and missing required tags.
    * **Compliance and metrics.** Missing tags, overlapping CIDRs and exhausted subnets are
      reported in status, as Kubernetes Events and as Prometheus metrics.
    * **Allocation (opt-in).** A `SubnetClaim` reserves free CIDRs in a VPC and, in `Create`
      mode, creates the subnets with the organization's tags. A `ResourceImport` brings an
      existing untagged network or subnet under management by tagging it. Both need
      `--enable-writes` and a separate write role; the operator never deletes a cloud resource.
    * **Sheet export.** A `SheetExport` mirrors a scope's subnets into a Google Sheet.

    Invalid objects are refused by admission webhooks. The API is `network.hypersurgery.dev/v1`
    with a written compatibility promise; `v1beta1` is still served, deprecated, and converted
    by the operator's conversion webhook.

    ## Before you install

    The operator needs AWS credentials in the cluster it runs in. On EKS, use
    **EKS Pod Identity**: associate an IAM role with the `subnet-operator-controller-manager`
    service account in the namespace the operator is installed in. IRSA needs an annotation on
    that service account, which OLM owns; see the OLM guide linked below for how to set it
    through the Subscription instead. The IAM policies and cross-account roles are in
    [deploy/iam](https://github.com/aivandrago/subnet-operator/tree/main/deploy/iam).

    Install the operator in all namespaces (the only install mode it supports: it serves
    conversion webhooks for its CRDs and watches cluster-scoped objects).

    ## Compared with the Helm chart

    The Helm chart is the primary way to install and has more options: two replicas with a
    PodDisruptionBudget, the dashboard, NetworkPolicies, the ServiceMonitor, alerting rules and
    the Grafana dashboard. The OLM bundle installs the operator, its CRDs, RBAC and webhooks.

    [Documentation](https://hypersurgery.dev/docs/) ·
    [OLM guide](https://github.com/aivandrago/subnet-operator/blob/main/docs/olm.md) ·
    [Source](https://github.com/aivandrago/subnet-operator)
