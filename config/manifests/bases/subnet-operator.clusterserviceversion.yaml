        path: resyncInterval
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
        - urn:alm:descriptor:com.tectonic.ui:advanced
      statusDescriptors:
      - description: 'conditions: Ready is True when every target synced successfully.'
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - description: lastSyncTime is when the last full sync finished.
        displayName: Last Sync
        path: lastSyncTime
        x-descriptors:
        - urn:alm:descriptor:timestamp
      - description: networks is the number of networks discovered across all targets.
        displayName: Networks
        path: networks
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: subnets is the number of subnets discovered across all targets.
        displayName: Subnets
        path: subnets
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      - description: targets reports each account/region pair.
        displayName: Targets
        path: targets
      - description: |-
          unmanaged is the number of discovered resources without the managed tag, across all
          targets. Anything above zero is something nobody has taken responsibility for.
        displayName: Unmanaged
        path: unmanaged
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:number
      version: v1beta1
    - description: |-
        ResourceImport takes an existing network or subnet under management by tagging it.
        The resource itself, and every tag the import does not name, is left exactly as it was.
      displayName: Resource Import
      kind: ResourceImport
      name: resourceimports.network.hypersurgery.dev
      resources:
      - kind: Event
        name: ""
        version: v1
      - kind: Network
        name: ""
        version: v1
      - kind: Subnet
        name: ""
        version: v1
      specDescriptors:
      - description: |-
          account is the account that owns the resource, in the provider's format (for AWS the
          12-digit account ID).
        displayName: Account
        path: account
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          dryRun records what would be applied without touching the cloud. The auto-import policy sets
          it in DryRun mode, so a day of imports can be reviewed before anything is tagged.
        displayName: Dry Run
        path: dryRun
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
      - description: region of the resource. Required for regional resources, which
          on AWS is every one.
        displayName: Region
        path: region
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: 'requestedBy records who asked for the import: a person, a team,
          or "auto-import policy".'
        displayName: Requested By
        path: requestedBy
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          resourceID is the provider ID of the network or subnet to tag: for AWS a VPC or subnet
          ID.
        displayName: Resource ID
        path: resourceID
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          scopeRef is the NetworkScope that supplies the credentials; the account and region
          below must be part of it.
        displayName: NetworkScope
        path: scopeRef
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: |-
          tags are applied to the resource. Tags with other keys are left alone: the operator
          only ever adds tags, it never removes one.
        displayName: Tags
        path: tags
      statusDescriptors:
      - description: appliedTime is when they were applied.
        displayName: Applied
        path: appliedTime
        x-descriptors:
        - urn:alm:descriptor:timestamp
      - description: |-
          conditions: Ready is True once the import is settled, whether it applied the tags or
          deliberately did nothing in a dry run.
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - description: error is the last failure, empty otherwise.
        displayName: Error
        path: error
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: state is Pending, Applied, Skipped (dry run) or Failed.
        displayName: State
        path: state
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      version: v1
