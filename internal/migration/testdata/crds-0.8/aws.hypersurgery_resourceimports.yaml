---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: resourceimports.aws.hypersurgery
spec:
  group: aws.hypersurgery
  names:
    kind: ResourceImport
    listKind: ResourceImportList
    plural: resourceimports
    singular: resourceimport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.resourceID
      name: Resource
      type: string
    - jsonPath: .spec.account
      name: Account
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.requestedBy
      name: Requested by
      priority: 1
      type: string
    deprecated: true
    deprecationWarning: aws.hypersurgery/v1alpha1 ResourceImport is deprecated and
      removed in 0.9; the operator migrates it to network.hypersurgery.dev/v1beta1
      ResourceImport, use that instead
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ResourceImport takes an existing VPC or subnet under management by tagging it in AWS.
          The resource itself, and every tag the import does not name, is left exactly as it was.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the tags to apply
            properties:
              account:
                description: account is the 12-digit AWS account ID that owns the
                  resource.
                pattern: ^[0-9]{12}$
                type: string
              dryRun:
                description: |-
                  dryRun records what would be applied without touching AWS. The auto-import policy sets
                  it in DryRun mode, so a day of imports can be reviewed before anything is tagged.
                type: boolean
              region:
                description: region is the AWS region of the resource.
                type: string
              requestedBy:
                description: 'requestedBy records who asked for the import: a person,
                  a team, or "auto-import policy".'
                type: string
              resourceID:
                description: resourceID is the VPC or subnet to tag.
                pattern: ^(vpc|subnet)-[0-9a-f]+$
                type: string
              scopeRef:
                description: |-
                  scopeRef is the NetworkScope that supplies the credentials; the account and region
                  below must be part of it.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: |-
                  tags are applied to the resource. Tags with other keys are left alone: the operator
                  only ever adds tags, it never removes one.
                minProperties: 1
                type: object
            required:
            - account
            - region
            - resourceID
            - scopeRef
            - tags
            type: object
          status:
            description: status defines the observed state of ResourceImport
            properties:
              appliedTags:
                additionalProperties:
                  type: string
                description: appliedTags are the tags that reached AWS.
                type: object
              appliedTime:
                description: appliedTime is when they were applied.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions: Ready is True once the import is settled, whether it applied the tags or
                  deliberately did nothing in a dry run.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              error:
                description: error is the last failure, empty otherwise.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  refers to.
                format: int64
                type: integer
              state:
                description: state is Pending, Applied, Skipped (dry run) or Failed.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
