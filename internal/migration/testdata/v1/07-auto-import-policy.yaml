apiVersion: network.hypersurgery.dev/v1
kind: NetworkScope
metadata:
  name: organization
spec:
  accounts:
  - aws:
      writeRoleARN: arn:aws:iam::111111111111:role/aws-subnet-operator-write
    id: "111111111111"
  - aws:
      roleARN: arn:aws:iam::222222222222:role/aws-subnet-operator-readonly
      writeRoleARN: arn:aws:iam::222222222222:role/aws-subnet-operator-write
    id: "222222222222"
  autoImport:
    accountDefaults:
    - account: "111111111111"
      tags:
        hs/env: prod
        hs/owner: team-platform
    fromCreator:
    - principalPrefix: arn:aws:sts::222222222222:assumed-role/payments-
      tags:
        hs/env: prod
        hs/owner: team-payments
    - principalPrefix: arn:aws:sts::111111111111:assumed-role/data-platform-
      tags:
        hs/owner: team-data
    inheritFromNetwork:
    - hs/owner
    - hs/env
    managedTag: hs/managed
    mode: DryRun
    namespace: platform
    requiredTags:
    - hs/owner
    skip:
    - tagKey: managed-by
      tagValue: terraform
    - principalPrefix: arn:aws:sts::222222222222:assumed-role/terraform-
  discoverUnmanaged: true
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - platform
      - default
  networkSelector:
    matchTags:
      hs/managed: "true"
  provider: AWS
  regions:
  - eu-central-1
  - eu-west-1
  requiredSubnetTags:
  - hs/owner
  - hs/env
  - hs/tier
  tagKeys:
    env: hs/env
    owner: hs/owner
    tier: hs/tier
