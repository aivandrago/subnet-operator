apiVersion: network.hypersurgery.dev/v1beta1
kind: NetworkScope
metadata:
  name: organization
spec:
  accounts:
  - id: "111111111111"
  - aws:
      roleARN: arn:aws:iam::222222222222:role/aws-subnet-operator-readonly
    id: "222222222222"
  - aws:
      externalID: a-shared-secret-from-the-stackset
      roleARN: arn:aws:iam::333333333333:role/aws-subnet-operator-readonly
    id: "333333333333"
    regions:
    - us-east-1
  namespaceSelector: {}
  networkSelector:
    matchTags:
      hs/managed: "true"
  provider: AWS
  regions:
  - eu-central-1
  - eu-west-1
  requiredSubnetTags:
  - hs/owner
  - hs/env
  - hs/tier
  resyncInterval: 10m0s
  tagKeys:
    env: hs/env
    owner: hs/owner
    tier: hs/tier
# notes:
# document 1: NetworkScope organization: spec.namespaceSelector was unset, which allowed every namespace in aws.hypersurgery/v1alpha1 and allows none in network.hypersurgery.dev; it is now {} (every namespace) so nothing is locked out. Replace it with a selector of the namespaces that should use the scope
