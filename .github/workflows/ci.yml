name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      # The OLM bundle is generated from config/manifests and the +operator-sdk markers in api/;
      # the regenerated CSV base must match the committed one, and the bundle must pass the
      # validation OperatorHub runs.
      - name: OLM bundle validates
        run: |
          make bundle-validate
          git diff --exit-code

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The generated code, CRDs and the chart's copies of them are committed, so a
      # pull request that edits api/ without regenerating them is caught here rather
      # than by a confusing failure at install time. The v1 API reference in
      # docs/reference/api.md is generated from the same types.
      - name: Generated code, manifests and API reference are up to date
        run: |
          make manifests generate api-docs
          git diff --exit-code

      - name: Helm chart lints and renders
        run: |
          make helm-lint
          git diff --exit-code charts/

      - name: Alerts fire when they should, and only then
        run: make test-alerts

      - name: Unit and envtest tests
        run: make test
      - name: Dashboard app
        run: make test-dashboard

      - name: Build
        run: make build

      - name: Coverage
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: cover.out

  # The badge is a shields.io endpoint file on the Pages branch, written by the run that
  # measured the number. A badge nobody updates is worse than no badge. It lives in its own
  # job so that only this step holds a token that can write to the repository.
  badge:
    name: Coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
      - run: hack/publish-coverage-badge.sh "$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')"
