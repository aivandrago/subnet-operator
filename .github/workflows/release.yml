name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and sign, e.g. v0.4.0"
        required: true
      dry_run:
        description: "Build both images but push and sign nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Build, sign and attest the image
    runs-on: ubuntu-latest
    permissions:
      contents: write     # attach the SBOM to the release
      packages: write     # push to ghcr.io
      id-token: write     # cosign keyless: the workflow's own OIDC identity signs
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Helm's appVersion carries no leading v, and the chart builds the image reference
          # from it, so the image answers to both spellings rather than to whichever one the
          # reader happened to use.
          echo "bare=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/subnet-operator" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Go cross-compiles natively, so both binaries are built here at full speed and the
      # image build below only packages them. Running the compiler for arm64 under QEMU
      # took twenty-five minutes; this takes one.
      - name: Cross-compile the manager
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -o dist/manager-linux-$arch ./cmd
          done
          ls -l dist/

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event.inputs.dry_run != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx produces the SBOM and the provenance attestation itself, so they describe what
      # was actually built rather than what a second tool later thought it saw.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.bare }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event.inputs.dry_run != 'true'
      - name: Sign the image
        if: github.event.inputs.dry_run != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # A signature nobody can check is decoration, so the command to check it is part of the
      # job and fails the release if it does not verify.
      - name: Verify the signature the way a user would
        if: github.event.inputs.dry_run != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            -o text | tail -5

      - name: Attach the SBOM to the release
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cosign download sbom "${IMAGE}@${DIGEST}" > sbom.spdx.json 2>/dev/null \
            || docker buildx imagetools inspect "${IMAGE}:${TAG}" \
                 --format '{{ json .SBOM }}' > sbom.spdx.json
          gh release upload "$TAG" sbom.spdx.json --clobber --repo "${{ github.repository }}"
