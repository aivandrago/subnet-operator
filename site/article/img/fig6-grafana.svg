<svg xmlns="http://www.w3.org/2000/svg" font-family="PT Serif, Georgia, serif" viewBox="0 0 1200 700" role="img" aria-label="A Grafana dashboard for the operator: stat tiles, free addresses over time, utilisation by environment, unmanaged resources by kind, a firing alert rule, and the Slack message it sends">
  <rect width="1200" height="700" fill="#f2ece0"/>

  <!-- grafana chrome -->
  <rect x="0" y="0" width="1200" height="44" fill="#e7dfd0"/>
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#ded5c4"/>
  <circle cx="26" cy="22" r="9" fill="none" stroke="#c1121f" stroke-width="2.5"/>
  <text x="48" y="27" font-size="14" font-weight="600" fill="#1a1714">Subnet inventory · hypersurgery</text>
  <rect x="980" y="10" width="112" height="24" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
  <text x="1036" y="26" text-anchor="middle" font-family="PT Mono, JetBrains Mono, monospace" font-size="11" fill="#4a443c">Last 24 hours</text>
  <rect x="1100" y="10" width="86" height="24" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
  <text x="1143" y="26" text-anchor="middle" font-family="PT Mono, JetBrains Mono, monospace" font-size="11" fill="#4a443c">refresh 30s</text>

  <!-- stat row -->
  <g>
    <rect x="16" y="60" width="182" height="86" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="30" y="80" font-size="11.5" fill="#4a443c">Subnets tracked</text>
    <text x="30" y="120" font-size="34" font-weight="700" fill="#1a1714">318</text>

    <rect x="208" y="60" width="182" height="86" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="222" y="80" font-size="11.5" fill="#4a443c">Free IPv4 addresses</text>
    <text x="222" y="120" font-size="34" font-weight="700" fill="#4a443c">16.8K</text>

    <rect x="400" y="60" width="182" height="86" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="414" y="80" font-size="11.5" fill="#4a443c">Subnets ≥ 80% used</text>
    <text x="414" y="120" font-size="34" font-weight="700" fill="#8f0d17">3</text>

    <rect x="592" y="60" width="182" height="86" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="606" y="80" font-size="11.5" fill="#4a443c">Missing required tags</text>
    <text x="606" y="120" font-size="34" font-weight="700" fill="#8f0d17">11</text>

    <rect x="784" y="60" width="182" height="86" rx="4" fill="#f7f3ea" stroke="#c1121f" stroke-width="2"/>
    <text x="798" y="80" font-size="11.5" fill="#4a443c">Unmanaged resources</text>
    <text x="798" y="120" font-size="34" font-weight="700" fill="#c1121f">5</text>

    <rect x="976" y="60" width="208" height="86" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="990" y="80" font-size="11.5" fill="#4a443c">Unreachable accounts</text>
    <text x="990" y="120" font-size="34" font-weight="700" fill="#c1121f">1</text>
  </g>

  <!-- timeseries -->
  <g>
    <rect x="16" y="158" width="580" height="216" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="30" y="180" font-size="13" font-weight="600" fill="#1a1714">Free IPv4 addresses by account</text>
    <text x="30" y="196" font-family="PT Mono, JetBrains Mono, monospace" font-size="10" fill="#7b7266">hs_aws_subnet_available_ips — sum by (account)</text>
    <g stroke="#ded5c4" stroke-width="1">
      <line x1="80" y1="226" x2="576" y2="226"/><line x1="80" y1="276" x2="576" y2="276"/>
      <line x1="80" y1="326" x2="576" y2="326"/>
    </g>
    <text x="72" y="230" text-anchor="end" font-family="PT Mono, JetBrains Mono, monospace" font-size="9" fill="#7b7266">10k</text>
    <text x="72" y="280" text-anchor="end" font-family="PT Mono, JetBrains Mono, monospace" font-size="9" fill="#7b7266">5k</text>
    <text x="72" y="330" text-anchor="end" font-family="PT Mono, JetBrains Mono, monospace" font-size="9" fill="#7b7266">0</text>
    <polyline points="80,232 160,236 240,238 320,244 400,246 480,252 576,256" fill="none" stroke="#4a443c" stroke-width="2"/>
    <polyline points="80,268 160,270 240,274 320,276 400,282 480,286 576,290" fill="none" stroke="#7b7266" stroke-width="2"/>
    <polyline points="80,296 160,298 240,300 320,306 400,308 480,312 576,316" fill="none" stroke="#c1121f" stroke-width="2"/>
    <g font-size="10.5">
      <rect x="86" y="344" width="9" height="9" rx="2" fill="#4a443c"/><text x="100" y="352" fill="#4a443c">platform · 1111</text>
      <rect x="206" y="344" width="9" height="9" rx="2" fill="#7b7266"/><text x="220" y="352" fill="#4a443c">payments · 2222</text>
      <rect x="336" y="344" width="9" height="9" rx="2" fill="#c1121f"/><text x="350" y="352" fill="#4a443c">data · 3333</text>
    </g>
  </g>

  <!-- bar gauge -->
  <g>
    <rect x="608" y="158" width="576" height="216" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="622" y="180" font-size="13" font-weight="600" fill="#1a1714">Utilisation by environment</text>
    <text x="622" y="196" font-family="PT Mono, JetBrains Mono, monospace" font-size="10" fill="#7b7266">1 - available / total, by hs/env · threshold 80%</text>
    <g font-family="PT Mono, JetBrains Mono, monospace" font-size="11">
      <text x="622" y="230" fill="#4a443c">prod</text>
      <rect x="700" y="220" width="380" height="14" rx="3" fill="#ded5c4"/>
      <rect x="700" y="220" width="296" height="14" rx="3" fill="#8f0d17"/>
      <text x="1092" y="231" fill="#1a1714">78%</text>

      <text x="622" y="264" fill="#4a443c">staging</text>
      <rect x="700" y="254" width="380" height="14" rx="3" fill="#ded5c4"/>
      <rect x="700" y="254" width="175" height="14" rx="3" fill="#4a443c"/>
      <text x="1092" y="265" fill="#1a1714">46%</text>

      <text x="622" y="298" fill="#4a443c">dev</text>
      <rect x="700" y="288" width="380" height="14" rx="3" fill="#ded5c4"/>
      <rect x="700" y="288" width="118" height="14" rx="3" fill="#4a443c"/>
      <text x="1092" y="299" fill="#1a1714">31%</text>

      <text x="622" y="332" fill="#4a443c">sandbox</text>
      <rect x="700" y="322" width="380" height="14" rx="3" fill="#ded5c4"/>
      <rect x="700" y="322" width="46" height="14" rx="3" fill="#4a443c"/>
      <text x="1092" y="333" fill="#1a1714">12%</text>
    </g>
    <line x1="1004" y1="212" x2="1004" y2="344" stroke="#c1121f" stroke-dasharray="4 4"/>
    <text x="1008" y="210" font-family="PT Mono, JetBrains Mono, monospace" font-size="9" fill="#c1121f">80%</text>
  </g>

  <!-- unmanaged by kind -->
  <g>
    <rect x="16" y="386" width="360" height="200" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="30" y="408" font-size="13" font-weight="600" fill="#1a1714">Appearing without hs/managed</text>
    <text x="30" y="424" font-family="PT Mono, JetBrains Mono, monospace" font-size="10" fill="#7b7266">increase(hs_aws_unmanaged_resources_total[1h])</text>
    <g font-family="PT Mono, JetBrains Mono, monospace" font-size="11">
      <text x="30" y="456" fill="#4a443c">subnet</text>
      <rect x="110" y="446" width="180" height="14" rx="3" fill="#c1121f"/><text x="300" y="457" fill="#1a1714">3</text>
      <text x="30" y="486" fill="#4a443c">vpc</text>
      <rect x="110" y="476" width="120" height="14" rx="3" fill="#c1121f" opacity=".7"/><text x="240" y="487" fill="#1a1714">2</text>
      <text x="30" y="516" fill="#4a443c">route table</text>
      <rect x="110" y="506" width="60" height="14" rx="3" fill="#c1121f" opacity=".45"/><text x="180" y="517" fill="#1a1714">1</text>
    </g>
    <text x="30" y="556" font-size="10.5" fill="#7b7266">Each resource is counted once, not on every resync.</text>
  </g>

  <!-- alert rule -->
  <g>
    <rect x="388" y="386" width="380" height="200" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="402" y="408" font-size="13" font-weight="600" fill="#1a1714">Alert rules</text>
    <rect x="402" y="422" width="352" height="46" rx="4" fill="rgba(242,73,92,.10)" stroke="#c1121f"/>
    <circle cx="418" cy="445" r="5" fill="#c1121f"/>
    <text x="432" y="441" font-size="11.5" font-weight="600" fill="#1a1714">UnmanagedNetworkResource</text>
    <text x="432" y="457" font-family="PT Mono, JetBrains Mono, monospace" font-size="10" fill="#c1121f">firing · 4m · severity=warning</text>

    <rect x="402" y="476" width="352" height="40" rx="4" fill="#efe9dd" stroke="#c9bfae"/>
    <circle cx="418" cy="496" r="5" fill="#4a443c"/>
    <text x="432" y="493" font-size="11.5" fill="#4a443c">SubnetNearlyFull</text>
    <text x="432" y="508" font-family="PT Mono, JetBrains Mono, monospace" font-size="10" fill="#7b7266">normal</text>

    <rect x="402" y="524" width="352" height="40" rx="4" fill="#efe9dd" stroke="#c9bfae"/>
    <circle cx="418" cy="544" r="5" fill="#8f0d17"/>
    <text x="432" y="541" font-size="11.5" fill="#4a443c">SubnetInventoryTargetDown</text>
    <text x="432" y="556" font-family="PT Mono, JetBrains Mono, monospace" font-size="10" fill="#8f0d17">pending · 333333333333 / eu-central-1</text>
  </g>

  <!-- slack card -->
  <g>
    <rect x="780" y="386" width="404" height="200" rx="4" fill="#f7f3ea" stroke="#c9bfae"/>
    <text x="794" y="408" font-size="13" font-weight="600" fill="#1a1714">#net-ops</text>
    <rect x="794" y="420" width="376" height="152" rx="6" fill="#e7dfd0"/>
    <rect x="794" y="420" width="4" height="152" rx="2" fill="#c1121f"/>
    <text x="810" y="442" font-size="12" font-weight="700" fill="#1a1714">Unmanaged network resource</text>
    <g font-family="PT Mono, JetBrains Mono, monospace" font-size="10.5" fill="#4a443c">
      <text x="810" y="464">subnet-0b2c3d4e5f6a7b89 · 10.20.40.0/22</text>
      <text x="810" y="482">account 222222222222 · eu-west-1</text>
      <text x="810" y="500">created by S. Okonkwo (console), 4 minutes ago</text>
      <text x="810" y="518">no hs/owner tag</text>
    </g>
    <rect x="810" y="530" width="104" height="26" rx="4" fill="#c1121f"/>
    <text x="862" y="547" text-anchor="middle" font-size="11" font-weight="600" fill="#f7f3ea">Import it</text>
    <rect x="924" y="530" width="120" height="26" rx="4" fill="#c9bfae"/>
    <text x="984" y="547" text-anchor="middle" font-size="11" fill="#1a1714">Open dashboard</text>
  </g>

  <text x="16" y="620" font-family="PT Mono, JetBrains Mono, monospace" font-size="10.5" fill="#7b7266">The dashboard JSON and the PrometheusRule ship inside the Helm chart. Nothing above is drawn by hand at install time.</text>
  <text x="16" y="642" font-family="PT Mono, JetBrains Mono, monospace" font-size="10.5" fill="#7b7266">Teams gets the same payload through its own webhook; the message names the resource, the account and the person.</text>
</svg>
