# helm install subnet-operator charts/subnet-operator -n subnet-operator-system \
#   --create-namespace -f examples/values-minimal.yaml
image:
  repository: ghcr.io/aivandrago/subnet-operator

providers:
  aws:
    # IRSA. With EKS Pod Identity, drop this and create an association instead.
    irsaRoleARN: arn:aws:iam::111111111111:role/aws-subnet-operator
    region: eu-central-1
