apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aws-subnet-operator.fullname" . }}
  labels:
    {{- include "aws-subnet-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [aws.hypersurgery]
    resources: [networkscopes, sheetexports, subnetclaims]
    verbs: [get, list, watch]
  # The auto-import policy writes ResourceImports; it never deletes one.
  - apiGroups: [aws.hypersurgery]
    resources: [resourceimports]
    verbs: [get, list, watch, create]
  - apiGroups: [aws.hypersurgery]
    resources: [networkscopes/status, sheetexports/status, subnetclaims/status, resourceimports/status,
                vpcs/status, subnets/status]
    verbs: [get, update, patch]
  - apiGroups: [aws.hypersurgery]
    resources: [networkscopes/finalizers]
    verbs: [update]
  - apiGroups: [aws.hypersurgery]
    resources: [vpcs, subnets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Google service account key for SheetExport.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aws-subnet-operator.fullname" . }}
  labels:
    {{- include "aws-subnet-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aws-subnet-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aws-subnet-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aws-subnet-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-subnet-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aws-subnet-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-subnet-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aws-subnet-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "aws-subnet-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.metrics.secure }}
---
# Lets Prometheus authenticate against the metrics endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aws-subnet-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "aws-subnet-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
{{- end }}
