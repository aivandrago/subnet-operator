---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: subnetclaims.aws.hypersurgery
spec:
  group: aws.hypersurgery
  names:
    kind: SubnetClaim
    listKind: SubnetClaimList
    plural: subnetclaims
    singular: subnetclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcID
      name: VPC
      type: string
    - jsonPath: .spec.prefixLength
      name: Prefix
      type: integer
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=="Allocated")].status
      name: Allocated
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.account
      name: Account
      priority: 1
      type: string
    - jsonPath: .spec.region
      name: Region
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SubnetClaim requests subnets in a VPC: the operator reserves free CIDRs and, in Create
          mode, creates the subnets with the organization's tags. Subnets are never deleted by the
          operator: deleting a claim leaves them in place.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired subnets
            properties:
              account:
                description: account is the 12-digit AWS account ID that owns the
                  VPC.
                pattern: ^[0-9]{12}$
                type: string
              availabilityZones:
                description: availabilityZones lists the AZs to create one subnet
                  in each, e.g. eu-central-1a.
                items:
                  type: string
                maxItems: 6
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              env:
                type: string
              mapPublicIPOnLaunch:
                description: mapPublicIPOnLaunch sets the subnet attribute of the
                  same name.
                type: boolean
              mode:
                default: Create
                description: mode is Allocate (reserve CIDRs only) or Create (also
                  create the subnets).
                enum:
                - Allocate
                - Create
                type: string
              namePrefix:
                description: namePrefix is the Name tag; the AZ suffix is appended,
                  e.g. payments-a. Defaults to the claim name.
                type: string
              owner:
                description: owner, env and tier become the hs/owner, hs/env and hs/tier
                  tags.
                type: string
              prefixLength:
                description: prefixLength is the size of every subnet, e.g. 24 for
                  a /24.
                format: int32
                maximum: 28
                minimum: 16
                type: integer
              region:
                description: region is the AWS region of the VPC.
                type: string
              routeTableID:
                description: routeTableID is associated with every created subnet.
                  Leave empty for the VPC main table.
                pattern: ^rtb-[0-9a-f]+$
                type: string
              scopeRef:
                description: |-
                  scopeRef is the NetworkScope whose inventory and credentials are used. The account and
                  region below must be part of that scope.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: tags are added to every subnet. The hs/* tags above win
                  on conflict.
                type: object
              tier:
                type: string
              vpcID:
                description: vpcID is the VPC the subnets are carved out of. It must
                  be discovered by the scope.
                pattern: ^vpc-[0-9a-f]+$
                type: string
            required:
            - account
            - availabilityZones
            - owner
            - prefixLength
            - region
            - scopeRef
            - vpcID
            type: object
          status:
            description: status defines the observed state of SubnetClaim
            properties:
              allocations:
                description: allocations, one per availability zone. CIDRs stay stable
                  once reserved.
                items:
                  description: SubnetAllocation is one reserved CIDR and, once created,
                    its subnet.
                  properties:
                    availabilityZone:
                      description: availabilityZone the subnet is for.
                      type: string
                    cidrBlock:
                      description: cidrBlock reserved for it.
                      type: string
                    error:
                      description: error is the last creation error, empty otherwise.
                      type: string
                    state:
                      description: state is Pending, Created or Failed.
                      type: string
                    subnetID:
                      description: subnetID once the subnet exists in AWS.
                      type: string
                  required:
                  - availabilityZone
                  - cidrBlock
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - availabilityZone
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  conditions: Allocated is True when every AZ has a CIDR; Ready is True when the claim
                  is fulfilled (subnets created, or allocated in Allocate mode).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  refers to.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
