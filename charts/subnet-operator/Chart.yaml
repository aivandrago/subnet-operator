apiVersion: v2
name: subnet-operator
description: Kubernetes operator that discovers cloud networks and subnets (AWS, Google Cloud and Azure) from resource tags and keeps a live inventory in the cluster
type: application
version: 3.0.0
appVersion: "3.0.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - aws
  - gcp
  - azure
  - vpc
  - subnet
  - ipam
  - networking
  - inventory
home: https://hypersurgery.dev
icon: https://hypersurgery.dev/dashboard/icon-512.png
sources:
  - https://github.com/aivandrago/subnet-operator
maintainers:
  - name: Ivan Drago
    email: feverondiva@proton.me
    url: https://github.com/aivandrago
# Read by Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/). The release
# workflow checks images, changes and prerelease against the tag, so these three are updated
# with the version at every release. A signing key is not listed: artifacthub.io/signKey
# describes a PGP key for Helm provenance files, while this chart is signed keyless with
# cosign, which Artifact Hub detects in the registry on its own.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/category: networking
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: subnet-operator
      image: ghcr.io/aivandrago/subnet-operator:3.0.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://hypersurgery.dev/docs/
    - name: Source
      url: https://github.com/aivandrago/subnet-operator
    - name: support
      url: https://github.com/aivandrago/subnet-operator/issues
    - name: Verify the signatures
      url: https://hypersurgery.dev/docs/#verify
    - name: Dashboard demo
      url: https://hypersurgery.dev/dashboard/
  artifacthub.io/changes: |
    - kind: added
      description: The Azure provider (provider Azure, providers.azure.enabled) discovers the virtual networks and subnets of the scope's subscriptions with their address usage and tags, in the whole subscription or in spec.azure.resourceGroups
    - kind: added
      description: Azure writes behind --enable-writes, a SubnetClaim creates one subnet in the virtual network's address space and a ResourceImport adds tags, only ever adding; a subnet's ownership is kept on its virtual network as the tag hs-subnet-<name>, within the 50 tags Azure allows (TagBudgetExceeded, OwnershipEntryTooLong)
    - kind: added
      description: An Azure import reads its virtual network before it writes, a subnet that does not exist is refused (ResourceNotFound) and spec.region is the network's location, filled in by the webhook (RegionMismatch)
    - kind: added
      description: Azure credentials through Microsoft Entra Workload ID (providers.azure.workloadIdentity), and a read and a write identity per subscription, in other tenants too (accounts[].azure.clientID, writeClientID, tenantID); providers.azure.cloud for the sovereign clouds
    - kind: added
      description: Azure change events from Event Grid through a Storage queue the operator polls (providers.azure.events.queueUrl); they carry no creator, so fromCreator rules never match in an Azure scope and the webhook warns about them
    - kind: added
      description: Azure subscription IDs, a claim's networkID and an import's resourceID are accepted in any case and stored in lowercase; tag names are matched without regard to case on Azure
    - kind: added
      description: The hs_network_tags metric and the NetworkTagBudgetLow alert (prometheusRule.thresholds.networkTags, 45 of 50) for Azure virtual networks; no other metric or alert changes
    - kind: added
      description: The chart's networkScope.create can create an Azure scope (networkScope.provider Azure, networkScope.azure.resourceGroups); Azure docs, IAM reference, runbooks, a Grafana panel for the tag budget and Azure in the dashboard app
    - kind: added
      description: The manager reads --azure-cloud, --azure-authority-host, --azure-events-queue-url and --azure-events-debounce also from SUBNET_OPERATOR_AZURE_* environment variables, for an OLM Subscription
    - kind: changed
      description: The maintainer's contact in the chart and the Artifact Hub metadata is feverondiva@proton.me; vulnerability reports still go to security@hypersurgery.dev
    - kind: changed
      description: "No breaking change: nothing changes for AWS and GCP scopes, and 3.0 is a major release because it adds a provider (see Upgrading from 2.x to 3.0). The Azure provider is tested against fakes of the Azure APIs, not yet against real subscriptions"
  artifacthub.io/crds: |
    - kind: NetworkScope
      version: v1
      name: networkscopes.network.hypersurgery.dev
      description: Accounts and regions of one provider to discover
    - kind: Network
      version: v1
      name: networks.network.hypersurgery.dev
      description: A discovered network (AWS VPC, GCP VPC network, Azure virtual network)
    - kind: Subnet
      version: v1
      name: subnets.network.hypersurgery.dev
      description: A discovered subnet
    - kind: ResourceImport
      version: v1
      name: resourceimports.network.hypersurgery.dev
      description: Takes an existing network or subnet under management by tagging it
    - kind: SheetExport
      version: v1
      name: sheetexports.network.hypersurgery.dev
      description: Read-only mirror of a scope in a Google Sheet
    - kind: SubnetClaim
      version: v1
      name: subnetclaims.network.hypersurgery.dev
      description: Subnets on demand, allocated from a network and optionally created
  artifacthub.io/crdsExamples: |
    - apiVersion: network.hypersurgery.dev/v1
      kind: NetworkScope
      metadata:
        name: organization
      spec:
        provider: AWS
        accounts:
          - id: "111111111111"
          - id: "222222222222"
            aws:
              roleARN: arn:aws:iam::222222222222:role/aws-subnet-operator-readonly
        regions: [eu-central-1, eu-west-1]
        networkSelector:
          matchTags:
            hs/managed: "true"
        requiredSubnetTags: [hs/owner, hs/env, hs/tier]
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values: [team-payments]
        resyncInterval: 10m
    - apiVersion: network.hypersurgery.dev/v1
      kind: SubnetClaim
      metadata:
        name: payments
        namespace: team-payments
      spec:
        scopeRef: organization
        account: "222222222222"
        region: eu-central-1
        networkID: vpc-0aa11bb2cc33dd44e
        prefixLength: 24
        zones: [eu-central-1a, eu-central-1b, eu-central-1c]
        mode: Create
        owner: team-payments
        env: prod
        tier: private
    - apiVersion: network.hypersurgery.dev/v1
      kind: ResourceImport
      metadata:
        name: subnet-04d1c2b3a4e5f607-import
        namespace: team-payments
      spec:
        scopeRef: organization
        account: "222222222222"
        region: eu-central-1
        resourceID: subnet-04d1c2b3a4e5f607
        tags:
          hs/managed: "true"
          hs/owner: team-payments
          hs/env: prod
          hs/tier: private
    - apiVersion: network.hypersurgery.dev/v1
      kind: SheetExport
      metadata:
        name: organization
      spec:
        scopeRef: organization
        spreadsheetID: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789
        sheetName: Subnets
        credentialsSecretRef:
          name: google-sheets
          namespace: subnet-operator-system
          key: credentials.json
        refreshInterval: 5m
