apiVersion: v2
name: subnet-operator
description: Kubernetes operator that discovers cloud networks and subnets (AWS, Google Cloud and Azure) from resource tags and keeps a live inventory in the cluster
type: application
version: 3.2.0
appVersion: "3.2.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - aws
  - gcp
  - azure
  - vpc
  - subnet
  - ipam
  - networking
  - inventory
home: https://hypersurgery.dev
icon: https://hypersurgery.dev/dashboard/icon-512.png
sources:
  - https://github.com/aivandrago/subnet-operator
maintainers:
  - name: Ivan Drago
    email: feverondiva@proton.me
    url: https://github.com/aivandrago
# Read by Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/). The release
# workflow checks images, changes and prerelease against the tag, so these three are updated
# with the version at every release. A signing key is not listed: artifacthub.io/signKey
# describes a PGP key for Helm provenance files, while this chart is signed keyless with
# cosign, which Artifact Hub detects in the registry on its own.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/category: networking
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: subnet-operator
      image: ghcr.io/aivandrago/subnet-operator:3.2.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://hypersurgery.dev/docs/
    - name: Source
      url: https://github.com/aivandrago/subnet-operator
    - name: support
      url: https://github.com/aivandrago/subnet-operator/issues
    - name: Verify the signatures
      url: https://hypersurgery.dev/docs/#verify
    - name: Dashboard demo
      url: https://hypersurgery.dev/dashboard/
  artifacthub.io/changes: |
    - kind: changed
      description: Azure discovery lists a subscription's virtual networks once per sync instead of once per location, in the fake 8 requests instead of 12 for two locations and 12 instead of 24 for four
    - kind: fixed
      description: A location of an Azure scope that does not exist now fails its target with the closest valid names (was Ready with no networks); a scope with a misspelt location turns SyncFailed until corrected
    - kind: changed
      description: The custom Azure reader role of deploy/azure gained Microsoft.Resources/subscriptions/locations/read, update the role definition; until then nothing fails and a TargetWarning Event says location names are not checked
    - kind: added
      description: manager azure-orphaned-entries lists the Azure ownership entries whose subnet no longer exists and prints the az commands that remove them, it only reads; the count is in Network status.azure.orphanedSubnetOwnershipEntries and the metric hs_network_orphaned_ownership_entries
    - kind: changed
      description: A token refused for the operator's own Azure identity is reported like one refused for a subscription's identity, naming the client, the tenant and the federated credential to check
  artifacthub.io/crds: |
    - kind: NetworkScope
      version: v1
      name: networkscopes.network.hypersurgery.dev
      description: Accounts and regions of one provider to discover
    - kind: Network
      version: v1
      name: networks.network.hypersurgery.dev
      description: A discovered network (AWS VPC, GCP VPC network, Azure virtual network)
    - kind: Subnet
      version: v1
      name: subnets.network.hypersurgery.dev
      description: A discovered subnet
    - kind: ResourceImport
      version: v1
      name: resourceimports.network.hypersurgery.dev
      description: Takes an existing network or subnet under management by tagging it
    - kind: SheetExport
      version: v1
      name: sheetexports.network.hypersurgery.dev
      description: Read-only mirror of a scope in a Google Sheet
    - kind: SubnetClaim
      version: v1
      name: subnetclaims.network.hypersurgery.dev
      description: Subnets on demand, allocated from a network and optionally created
  artifacthub.io/crdsExamples: |
    - apiVersion: network.hypersurgery.dev/v1
      kind: NetworkScope
      metadata:
        name: organization
      spec:
        provider: AWS
        accounts:
          - id: "111111111111"
          - id: "222222222222"
            aws:
              roleARN: arn:aws:iam::222222222222:role/aws-subnet-operator-readonly
        regions: [eu-central-1, eu-west-1]
        networkSelector:
          matchTags:
            hs/managed: "true"
        requiredSubnetTags: [hs/owner, hs/env, hs/tier]
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values: [team-payments]
        resyncInterval: 10m
    - apiVersion: network.hypersurgery.dev/v1
      kind: SubnetClaim
      metadata:
        name: payments
        namespace: team-payments
      spec:
        scopeRef: organization
        account: "222222222222"
        region: eu-central-1
        networkID: vpc-0aa11bb2cc33dd44e
        prefixLength: 24
        zones: [eu-central-1a, eu-central-1b, eu-central-1c]
        mode: Create
        owner: team-payments
        env: prod
        tier: private
    - apiVersion: network.hypersurgery.dev/v1
      kind: ResourceImport
      metadata:
        name: subnet-04d1c2b3a4e5f607-import
        namespace: team-payments
      spec:
        scopeRef: organization
        account: "222222222222"
        region: eu-central-1
        resourceID: subnet-04d1c2b3a4e5f607
        tags:
          hs/managed: "true"
          hs/owner: team-payments
          hs/env: prod
          hs/tier: private
    - apiVersion: network.hypersurgery.dev/v1
      kind: SheetExport
      metadata:
        name: organization
      spec:
        scopeRef: organization
        spreadsheetID: 1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789
        sheetName: Subnets
        credentialsSecretRef:
          name: google-sheets
          namespace: subnet-operator-system
          key: credentials.json
        refreshInterval: 5m
