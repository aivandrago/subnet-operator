{{- if .Values.prometheusRule.enabled }}
{{- $used := .Values.prometheusRule.thresholds.subnetUsedRatio }}
{{- $down := .Values.prometheusRule.operatorDown }}
{{- $downJob := $down.job | default (printf "%s-metrics" (include "subnet-operator.fullname" .)) }}
{{- $renderDown := or $down.job .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "subnet-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "subnet-operator.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: subnet-inventory
      rules:
        {{- if $renderDown }}
        # Every other rule is computed from the operator's own metrics, so when the operator is
        # gone their series vanish and they go quiet rather than firing. This one fires on the
        # absence itself: no replica is up. With two replicas, one of them dying is not an
        # outage — the other takes the lease — so it asks for none, not fewer.
        - alert: SubnetOperatorDown
          expr: absent(up{job="{{ $downJob }}", namespace="{{ .Release.Namespace }}"} == 1)
          for: {{ $down.for }}
          labels:
            severity: critical
          annotations:
            summary: "The subnet operator is not running"
            description: >-
              No replica of the operator in {{ .Release.Namespace }} has been scraped
              successfully for {{ $down.for }}. The inventory is no longer being maintained,
              and none of the other alerts can fire while it is down.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetoperatordown"
        {{- end }}

        # The expressions read the hs_* metrics, which have a provider label.
        - alert: SubnetNearlyFull
          expr: 1 - hs_subnet_available_ips / hs_subnet_total_ips >= {{ $used }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Subnet {{`{{ $labels.subnet_id }}`}} is {{`{{ $value | humanizePercentage }}`}} full"
            description: >-
              {{`{{ $labels.cidr }}`}} in {{`{{ $labels.account }}`}}/{{`{{ $labels.region }}`}}
              ({{`{{ $labels.provider }}`}}, owner {{`{{ $labels.owner }}`}}) is running out of addresses.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetnearlyfull"

        - alert: SubnetFull
          expr: hs_subnet_available_ips == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Subnet {{`{{ $labels.subnet_id }}`}} has no free addresses"
            description: >-
              {{`{{ $labels.cidr }}`}} in {{`{{ $labels.account }}`}}/{{`{{ $labels.region }}`}}
              ({{`{{ $labels.provider }}`}}) cannot take another network interface.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetfull"

        - alert: SubnetInventoryTargetDown
          expr: hs_target_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Discovery of {{`{{ $labels.account }}`}}/{{`{{ $labels.region }}`}} is failing"
            description: >-
              The inventory of this {{`{{ $labels.provider }}`}} account and region is stale.
              Check the NetworkScope status for the error, usually a credentials or permissions
              problem (on AWS, the IAM role or its trust policy).
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetinventorytargetdown"

        - alert: SubnetInventoryTargetThrottled
          # Reachable but rate-limited. hs_target_up stays 1 for a throttled target, so this
          # and SubnetInventoryTargetDown never fire for the same one: the causes differ, and so
          # do the fixes. The operator backs the target off and retries it on its own; this only
          # fires when that has not got through for a while.
          expr: hs_target_throttled == 1
          for: {{ .Values.prometheusRule.thresholds.throttledFor }}
          labels:
            severity: warning
          annotations:
            summary: "Discovery of {{`{{ $labels.account }}`}}/{{`{{ $labels.region }}`}} is throttled by the cloud provider"
            description: >-
              The {{`{{ $labels.provider }}`}} API has been rate-limiting this account and region for {{ .Values.prometheusRule.thresholds.throttledFor }},
              so its inventory is stale. The operator keeps retrying with backoff. Something else
              in the account is using up its API budget, or this instance serves too many targets.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetinventorytargetthrottled"

        # Called VPCCIDROverlap up to 0.8; the rule covers every provider's networks.
        - alert: NetworkCIDROverlap
          expr: hs_network_cidr_overlaps > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Network {{`{{ $labels.network_id }}`}} overlaps another network"
            description: >-
              {{`{{ $labels.network_id }}`}} in {{`{{ $labels.account }}`}}/{{`{{ $labels.region }}`}}
              ({{`{{ $labels.provider }}`}}) has CIDRs that overlap another network in the scope.
              Overlapping CIDRs break peering and transit routing between them.
              See status.overlapsWith on the Network object.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#networkcidroverlap"

        - alert: SubnetInventoryStale
          expr: time() - hs_scope_last_sync_timestamp_seconds > {{ .Values.prometheusRule.thresholds.staleSyncSeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Scope {{`{{ $labels.scope }}`}} has not fully synced recently"
            description: >-
              The operator is not completing full resyncs. Check that it is running and
              that its credentials still work.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetinventorystale"

        - alert: UnmanagedNetworkResource
          # The counter rises once per resource the operator has never seen before, so an
          # increase means something appeared that nobody has taken responsibility for. The
          # window is longer than the for: a window of exactly 10m showed one new resource for
          # 10 minutes minus one evaluation, so the alert never got past pending for it.
          expr: increase(hs_unmanaged_resources_total[30m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{`{{ $value | printf \"%.0f\" }}`}} new unmanaged {{`{{ $labels.kind }}`}} resources in {{`{{ $labels.account }}`}}/{{`{{ $labels.region }}`}}"
            description: >-
              Something was created without the {{ .Values.managedTag | default "hs/managed" }} tag.
              Import it to take it under management, or add an auto-import rule so the next one
              is tagged on its own. The dashboard lists them:
              https://hypersurgery.dev/dashboard/
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#unmanagednetworkresource"

        - alert: SubnetClaimNotReady
          # A claim is a request someone is waiting on. Until now a claim stuck on NoSpace or
          # CreateFailed was visible only in its status, so nothing could page on it.
          expr: hs_subnet_claim_ready == 0
          for: {{ .Values.prometheusRule.thresholds.notReadyFor }}
          labels:
            severity: warning
          annotations:
            summary: "SubnetClaim {{`{{ $labels.namespace }}/{{ $labels.name }}`}} is not fulfilled: {{`{{ $labels.reason }}`}}"
            description: >-
              The claim has not been fulfilled for {{ .Values.prometheusRule.thresholds.notReadyFor }}.
              kubectl describe subnetclaim -n {{`{{ $labels.namespace }} {{ $labels.name }}`}}
              says why, in the Ready condition's message.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetclaimnotready"

        - alert: ResourceImportNotSettled
          # Pending or Failed for this long means the tags someone asked for have not reached
          # the cloud. A dry run counts as settled: it did what it was asked.
          expr: hs_resource_import_ready == 0
          for: {{ .Values.prometheusRule.thresholds.notReadyFor }}
          labels:
            severity: warning
          annotations:
            summary: "ResourceImport {{`{{ $labels.namespace }}/{{ $labels.name }}`}} is {{`{{ $labels.state }}`}}: {{`{{ $labels.reason }}`}}"
            description: >-
              The import has not been applied for {{ .Values.prometheusRule.thresholds.notReadyFor }}.
              kubectl describe resourceimport -n {{`{{ $labels.namespace }} {{ $labels.name }}`}}
              says why.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#resourceimportnotsettled"

        - alert: AutoImportedResources
          # Informational: a digest of what the policy took care of, not something to page on.
          expr: increase(hs_auto_imports_total{result="applied"}[24h]) > 0
          labels:
            severity: info
          annotations:
            summary: "{{`{{ $value | printf \"%.0f\" }}`}} resources auto-imported in {{`{{ $labels.account }}`}}/{{`{{ $labels.region }}`}}"
            description: >-
              The auto-import policy tagged these itself. Review them with
              kubectl get resourceimports -A.
            runbook_url: "https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#autoimportedresources"
{{- end }}
