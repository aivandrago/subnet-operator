---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: vpcs.aws.hypersurgery
spec:
  group: aws.hypersurgery
  names:
    kind: VPC
    listKind: VPCList
    plural: vpcs
    singular: vpc
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.account
      name: Account
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.name
      name: Name
      type: string
    - jsonPath: .status.cidrBlocks[0]
      name: CIDR
      type: string
    - jsonPath: .status.owner
      name: Owner
      type: string
    - jsonPath: .status.subnets
      name: Subnets
      type: integer
    - jsonPath: .status.availableIPs
      name: Free IPs
      type: integer
    - jsonPath: .status.env
      name: Env
      priority: 1
      type: string
    - jsonPath: .status.overlapsWith
      name: Overlaps
      priority: 1
      type: string
    deprecated: true
    deprecationWarning: aws.hypersurgery/v1alpha1 VPC is deprecated and removed in
      0.9; network.hypersurgery.dev/v1beta1 Network replaces it
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VPC is an AWS VPC discovered by a NetworkScope. It is read-only
          for users.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec identifies the VPC
            properties:
              account:
                description: account is the AWS account ID that owns the VPC.
                type: string
              region:
                description: region is the AWS region of the VPC.
                type: string
              vpcID:
                description: vpcID is the AWS VPC ID.
                type: string
            required:
            - account
            - region
            - vpcID
            type: object
          status:
            description: status is the observed state of the VPC
            properties:
              availableIPs:
                description: availableIPs is the sum of free IPv4 addresses in all
                  subnets.
                format: int64
                type: integer
              cidrBlocks:
                description: cidrBlocks are the associated IPv4 CIDR blocks, primary
                  first.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              env:
                description: env is read from the env tag configured in the NetworkScope.
                type: string
              ipv6CIDRBlocks:
                description: ipv6CIDRBlocks are the associated IPv6 CIDR blocks.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              isDefault:
                description: isDefault is true for the default VPC of the region.
                type: boolean
              name:
                description: name is the value of the Name tag.
                type: string
              overlapsWith:
                description: |-
                  overlapsWith lists VPCs in the same NetworkScope whose CIDRs overlap this VPC,
                  as "<account>/<region>/<vpc-id>". Overlaps break peering and Transit Gateway routing.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              owner:
                description: owner is read from the owner tag configured in the NetworkScope.
                type: string
              state:
                description: state is the AWS VPC state.
                type: string
              subnets:
                description: subnets is the number of discovered subnets.
                format: int32
                type: integer
              tags:
                additionalProperties:
                  type: string
                description: tags are the AWS tags of the VPC.
                type: object
              totalIPs:
                description: totalIPs is the sum of usable IPv4 addresses in all subnets.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
