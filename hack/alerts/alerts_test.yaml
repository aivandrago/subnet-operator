# Behaviour of the chart's alerts, checked by hack/alerts/test.sh with promtool.
#
# Written against release "r" in namespace "ops", so the operator's scrape job is
# r-subnet-operator-metrics.

rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # The gap SubnetOperatorDown closes. When the operator dies, the series the other alerts are
  # computed from simply stop, so a stale-inventory rule has nothing to evaluate and says
  # nothing. This case pins that down: if it ever starts failing, the reasoning behind
  # SubnetOperatorDown has changed and deserves a second look.
  - name: a vanished inventory is silent to the stale-sync rule
    interval: 1m
    input_series:
      - series: 'hs_scope_last_sync_timestamp_seconds{provider="aws", scope="org"}'
        values: '0 _x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: SubnetInventoryStale
        exp_alerts: []

  - name: an operator that is not running at all is an outage
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: SubnetOperatorDown
        exp_alerts: []          # not yet: the rule waits 10m before it fires
      - eval_time: 11m
        alertname: SubnetOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The subnet operator is not running
              description: >-
                No replica of the operator in ops has been scraped successfully for 10m.
                The inventory is no longer being maintained, and none of the other alerts
                can fire while it is down.
              runbook_url: https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetoperatordown

  - name: both replicas up is quiet
    interval: 1m
    input_series:
      - series: 'up{job="r-subnet-operator-metrics", namespace="ops", pod="a"}'
        values: '1x30'
      - series: 'up{job="r-subnet-operator-metrics", namespace="ops", pod="b"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: SubnetOperatorDown
        exp_alerts: []

  # Two replicas exist so that one of them dying is not an outage: the other takes the lease.
  - name: losing one replica of two is not an outage
    interval: 1m
    input_series:
      - series: 'up{job="r-subnet-operator-metrics", namespace="ops", pod="a"}'
        values: '1x30'
      - series: 'up{job="r-subnet-operator-metrics", namespace="ops", pod="b"}'
        values: '1x5 0x25'
    alert_rule_test:
      - eval_time: 25m
        alertname: SubnetOperatorDown
        exp_alerts: []

  - name: both replicas failing their scrape is an outage
    interval: 1m
    input_series:
      - series: 'up{job="r-subnet-operator-metrics", namespace="ops", pod="a"}'
        values: '1x5 0x25'
      - series: 'up{job="r-subnet-operator-metrics", namespace="ops", pod="b"}'
        values: '1x5 0x25'
    alert_rule_test:
      - eval_time: 12m
        alertname: SubnetOperatorDown
        exp_alerts: []          # down since minute 6, so not yet for the full 10m
      - eval_time: 17m
        alertname: SubnetOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The subnet operator is not running
              description: >-
                No replica of the operator in ops has been scraped successfully for 10m.
                The inventory is no longer being maintained, and none of the other alerts
                can fire while it is down.
              runbook_url: https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetoperatordown

  # An operator in another namespace, or scraped under another job, says nothing about this one.
  - name: another release being up does not hide this one being down
    interval: 1m
    input_series:
      - series: 'up{job="other-subnet-operator-metrics", namespace="ops", pod="x"}'
        values: '1x30'
      - series: 'up{job="r-subnet-operator-metrics", namespace="staging", pod="y"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: SubnetOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The subnet operator is not running
              description: >-
                No replica of the operator in ops has been scraped successfully for 10m.
                The inventory is no longer being maintained, and none of the other alerts
                can fire while it is down.
              runbook_url: https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetoperatordown

  # The fix for IPv6-only subnets (they no longer export IPv4 capacity) must not quiet the real
  # thing: an IPv4 subnet with nothing free still pages.
  - name: a genuinely full IPv4 subnet still pages
    interval: 1m
    input_series:
      - series: 'hs_subnet_available_ips{provider="aws", subnet_id="subnet-full", cidr="10.0.9.0/24", account="111111111111", region="eu-central-1"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SubnetFull
        exp_alerts:
          - exp_labels:
              severity: critical
              provider: aws
              subnet_id: subnet-full
              cidr: 10.0.9.0/24
              account: "111111111111"
              region: eu-central-1
            exp_annotations:
              summary: Subnet subnet-full has no free addresses
              description: 10.0.9.0/24 in 111111111111/eu-central-1 (aws) cannot take another network interface.

  # Claims and imports are requests someone is waiting on; before these gauges existed, a stuck
  # one was visible only in its status.
  - name: a claim stuck on NoSpace pages after the threshold
    interval: 1m
    input_series:
      - series: 'hs_subnet_claim_ready{provider="aws", namespace="payments", name="checkout", reason="NoSpace"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: SubnetClaimNotReady
        exp_alerts: []          # a retry or two is normal
      - eval_time: 35m
        alertname: SubnetClaimNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              namespace: payments
              name: checkout
              reason: NoSpace
            exp_annotations:
              summary: "SubnetClaim payments/checkout is not fulfilled: NoSpace"
              description: >-
                The claim has not been fulfilled for 30m.
                kubectl describe subnetclaim -n payments checkout
                says why, in the Ready condition's message.
              runbook_url: https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetclaimnotready

  - name: a claim that is slow but gets there never pages
    interval: 1m
    input_series:
      - series: 'hs_subnet_claim_ready{provider="aws", namespace="web", name="edge", reason="Created"}'
        values: '0x20 1x40'
    alert_rule_test:
      - eval_time: 55m
        alertname: SubnetClaimNotReady
        exp_alerts: []

  - name: an import the cloud keeps refusing pages, a dry run does not
    interval: 1m
    input_series:
      - series: 'hs_resource_import_ready{provider="aws", namespace="default", name="subnet-0a-import", state="Failed", reason="TagsNotApplied"}'
        values: '0x60'
      - series: 'hs_resource_import_ready{provider="aws", namespace="default", name="subnet-0b-import", state="Skipped", reason="DryRun"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: ResourceImportNotSettled
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              namespace: default
              name: subnet-0a-import
              state: Failed
              reason: TagsNotApplied
            exp_annotations:
              summary: "ResourceImport default/subnet-0a-import is Failed: TagsNotApplied"
              description: >-
                The import has not been applied for 30m.
                kubectl describe resourceimport -n default subnet-0a-import
                says why.
              runbook_url: https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#resourceimportnotsettled

  # Throttled and unreachable are different problems with different fixes, so they are different
  # alerts that never fire for the same target: a throttled target reports hs_target_up 1
  # (it answered, only not fast enough) and hs_target_throttled 1.
  - name: a throttled target alerts as throttled, not as down
    interval: 1m
    input_series:
      - series: 'hs_target_up{provider="aws", scope="org", account="111111111111", region="eu-central-1"}'
        values: '1x60'
      - series: 'hs_target_throttled{provider="aws", scope="org", account="111111111111", region="eu-central-1"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: SubnetInventoryTargetThrottled
        exp_alerts: []          # the operator is still backing off and retrying on its own
      - eval_time: 35m
        alertname: SubnetInventoryTargetThrottled
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              scope: org
              account: "111111111111"
              region: eu-central-1
            exp_annotations:
              summary: Discovery of 111111111111/eu-central-1 is throttled by the cloud provider
              description: >-
                The aws API has been rate-limiting this account and region for 30m,
                so its inventory is stale. The operator keeps retrying with backoff. Something else
                in the account is using up its API budget, or this instance serves too many targets.
              runbook_url: https://github.com/aivandrago/subnet-operator/blob/main/docs/operations/runbook.md#subnetinventorytargetthrottled
      - eval_time: 35m
        alertname: SubnetInventoryTargetDown
        exp_alerts: []

  - name: an unreachable target alerts as down, not as throttled
    interval: 1m
    input_series:
      - series: 'hs_target_up{provider="aws", scope="org", account="222222222222", region="eu-central-1"}'
        values: '0x60'
      - series: 'hs_target_throttled{provider="aws", scope="org", account="222222222222", region="eu-central-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: SubnetInventoryTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              scope: org
              account: "222222222222"
              region: eu-central-1
            exp_annotations:
              summary: Discovery of 222222222222/eu-central-1 is failing
              description: >-
                The inventory of this aws account and region is stale.
                Check the NetworkScope status for the error, usually a credentials or permissions
                problem (on AWS, the IAM role or its trust policy).
      - eval_time: 35m
        alertname: SubnetInventoryTargetThrottled
        exp_alerts: []

  # The backoff is meant to ride out a busy spell on its own; one that ends within the
  # threshold is not worth anyone's attention.
  - name: a target throttled for a while that then gets through never alerts
    interval: 1m
    input_series:
      - series: 'hs_target_up{provider="aws", scope="org", account="333333333333", region="eu-central-1"}'
        values: '1x60'
      - series: 'hs_target_throttled{provider="aws", scope="org", account="333333333333", region="eu-central-1"}'
        values: '1x20 0x40'
    alert_rule_test:
      - eval_time: 45m
        alertname: SubnetInventoryTargetThrottled
        exp_alerts: []
      - eval_time: 45m
        alertname: SubnetInventoryTargetDown
        exp_alerts: []

  # The full-subnet rules read free against usable addresses. A subnet at the threshold warns, one
  # below it does not, and an IPv6-only subnet (no IPv4 capacity series at all) says nothing.
  - name: a subnet past the used ratio warns, one below it does not
    interval: 1m
    input_series:
      - series: 'hs_subnet_available_ips{provider="aws", scope="org", account="111111111111", region="eu-central-1", network_id="vpc-1", subnet_id="subnet-busy", cidr="10.0.1.0/24", zone="eu-central-1a", owner="payments"}'
        values: '25x30'
      - series: 'hs_subnet_total_ips{provider="aws", scope="org", account="111111111111", region="eu-central-1", network_id="vpc-1", subnet_id="subnet-busy", cidr="10.0.1.0/24", zone="eu-central-1a", owner="payments"}'
        values: '251x30'
      - series: 'hs_subnet_available_ips{provider="aws", scope="org", account="111111111111", region="eu-central-1", network_id="vpc-1", subnet_id="subnet-calm", cidr="10.0.2.0/24", zone="eu-central-1b", owner="payments"}'
        values: '200x30'
      - series: 'hs_subnet_total_ips{provider="aws", scope="org", account="111111111111", region="eu-central-1", network_id="vpc-1", subnet_id="subnet-calm", cidr="10.0.2.0/24", zone="eu-central-1b", owner="payments"}'
        values: '251x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: SubnetNearlyFull
        exp_alerts: []          # not for the full 15m yet
      - eval_time: 20m
        alertname: SubnetNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              scope: org
              account: "111111111111"
              region: eu-central-1
              network_id: vpc-1
              subnet_id: subnet-busy
              cidr: 10.0.1.0/24
              zone: eu-central-1a
              owner: payments
            exp_annotations:
              summary: Subnet subnet-busy is 90.04% full
              description: >-
                10.0.1.0/24 in 111111111111/eu-central-1
                (aws, owner payments) is running out of addresses.
      - eval_time: 20m
        alertname: SubnetFull
        exp_alerts: []          # nearly full is not full

  - name: a subnet with addresses left is not full
    interval: 1m
    input_series:
      - series: 'hs_subnet_available_ips{provider="aws", subnet_id="subnet-ok", cidr="10.0.3.0/24", account="111111111111", region="eu-central-1"}'
        values: '0x5 3x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: SubnetFull
        exp_alerts: []

  - name: overlapping networks warn after half an hour, separate ones never
    interval: 1m
    input_series:
      - series: 'hs_network_cidr_overlaps{provider="aws", scope="org", account="111111111111", region="eu-central-1", network_id="vpc-hub", name="hub", owner="network", env="prod"}'
        values: '1x60'
      - series: 'hs_network_cidr_overlaps{provider="aws", scope="org", account="222222222222", region="eu-central-1", network_id="vpc-spoke", name="spoke", owner="web", env="prod"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: NetworkCIDROverlap
        exp_alerts: []
      - eval_time: 35m
        alertname: NetworkCIDROverlap
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              scope: org
              account: "111111111111"
              region: eu-central-1
              network_id: vpc-hub
              name: hub
              owner: network
              env: prod
            exp_annotations:
              summary: Network vpc-hub overlaps another network
              description: >-
                vpc-hub in 111111111111/eu-central-1
                (aws) has CIDRs that overlap another network in the scope.
                Overlapping CIDRs break peering and transit routing between them.
                See status.overlapsWith on the Network object.

  # Complements the first test: a scope whose sync stopped while the operator keeps exporting
  # its last timestamp is stale, and says so.
  - name: a scope that stopped syncing is stale, one that keeps syncing is not
    interval: 1m
    input_series:
      # Unix time 0 at the start, then no longer moving: an hour and more behind by minute 61.
      - series: 'hs_scope_last_sync_timestamp_seconds{provider="aws", scope="stuck"}'
        values: '0x100'
      # Syncing every minute: always as new as the evaluation time.
      - series: 'hs_scope_last_sync_timestamp_seconds{provider="aws", scope="healthy"}'
        values: '0+60x100'
    alert_rule_test:
      - eval_time: 65m
        alertname: SubnetInventoryStale
        exp_alerts: []          # stale since 60m, not for the full 10m yet
      - eval_time: 75m
        alertname: SubnetInventoryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              scope: stuck
            exp_annotations:
              summary: Scope stuck has not fully synced recently
              description: >-
                The operator is not completing full resyncs. Check that it is running and
                that its credentials still work.

  # The counter rises once per resource first seen. A step is something new nobody owns; a flat
  # counter, however high, is resources the operator already reported.
  - name: a newly unmanaged network alerts, a known one does not
    interval: 1m
    input_series:
      - series: 'hs_unmanaged_resources_total{provider="aws", scope="org", account="111111111111", region="eu-central-1", kind="network"}'
        values: '3x5 4x60'
      - series: 'hs_unmanaged_resources_total{provider="aws", scope="org", account="111111111111", region="eu-central-1", kind="subnet"}'
        values: '7x65'
    alert_rule_test:
      - eval_time: 12m
        alertname: UnmanagedNetworkResource
        exp_alerts: []          # pending: new since minute 6
      # One new resource is enough. With the old 10m window it never was: the increase lasted
      # 10 minutes minus one evaluation, one short of the for.
      - eval_time: 17m
        alertname: UnmanagedNetworkResource
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: aws
              scope: org
              account: "111111111111"
              region: eu-central-1
              kind: network
            exp_annotations:
              summary: 1 new unmanaged network resources in 111111111111/eu-central-1
              description: >-
                Something was created without the hs/managed tag.
                Import it to take it under management, or add an auto-import rule so the next one
                is tagged on its own. The dashboard lists them:
                https://hypersurgery.dev/dashboard/
              runbook_url: https://hypersurgery.dev/docs/#unmanaged
      # Once the step has left the window, the alert resolves.
      - eval_time: 40m
        alertname: UnmanagedNetworkResource
        exp_alerts: []

  - name: an import that settled never pages
    interval: 1m
    input_series:
      - series: 'hs_resource_import_ready{provider="aws", namespace="default", name="subnet-0c-import", state="Applied", reason="Applied"}'
        values: '0x10 1x50'
    alert_rule_test:
      - eval_time: 55m
        alertname: ResourceImportNotSettled
        exp_alerts: []

  # Informational: a digest of the day, and only for imports that were applied.
  - name: applied auto-imports make a digest, dry runs and skips do not
    interval: 1h
    input_series:
      - series: 'hs_auto_imports_total{provider="aws", scope="org", account="111111111111", region="eu-central-1", result="applied"}'
        values: '0 0 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2'
      - series: 'hs_auto_imports_total{provider="aws", scope="org", account="222222222222", region="eu-central-1", result="dryrun"}'
        values: '0+1x50'
      - series: 'hs_auto_imports_total{provider="aws", scope="org", account="222222222222", region="eu-central-1", result="skipped"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 3h
        alertname: AutoImportedResources
        exp_alerts:
          - exp_labels:
              severity: info
              provider: aws
              scope: org
              account: "111111111111"
              region: eu-central-1
              result: applied
            exp_annotations:
              summary: 2 resources auto-imported in 111111111111/eu-central-1
              description: >-
                The auto-import policy tagged these itself. Review them with
                kubectl get resourceimports -A.
      # A day after the last one there is nothing left to report.
      - eval_time: 48h
        alertname: AutoImportedResources
        exp_alerts: []

  # Why the operator exports every auto-import result at 0 as soon as a scope runs the policy.
  # After a restart the counters start again from nothing. The target whose series is there at 0
  # before its first import shows that import; the one whose series first appears at 1, as it
  # did before 0.9, has not increased as far as Prometheus can tell, and the digest leaves it
  # out.
  - name: the first auto-import after a restart is in the digest when its series starts at zero
    interval: 1h
    input_series:
      - series: 'hs_auto_imports_total{provider="aws", scope="org", account="111111111111", region="eu-central-1", result="applied"}'
        values: '_ _ 0 1 1 1 1 1 1 1 1'
      - series: 'hs_auto_imports_total{provider="aws", scope="org", account="222222222222", region="eu-central-1", result="applied"}'
        values: '_ _ _ 1 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 5h
        alertname: AutoImportedResources
        exp_alerts:
          - exp_labels:
              severity: info
              provider: aws
              scope: org
              account: "111111111111"
              region: eu-central-1
              result: applied
            exp_annotations:
              summary: 1 resources auto-imported in 111111111111/eu-central-1
              description: >-
                The auto-import policy tagged these itself. Review them with
                kubectl get resourceimports -A.
